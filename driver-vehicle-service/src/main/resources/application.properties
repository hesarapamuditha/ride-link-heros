server.port=8082
spring.application.name=driver-vehicle-service

# Cloud MongoDB Atlas Configuration
# Overwrite with environment variable: SPRING_DATA_MONGODB_URI
# Example: mongodb+srv://<user>:<password>@cluster0.mongodb.net/ridelink_driver_db?retryWrites=true&w=majority
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/ridelink_driver_db}}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
ridelink.jwt.secret=${JWT_SECRET:RideLinkSuperSecretSigningKeyForJwtTokensSecure2026!}
ridelink.jwt.expiration-ms=86400000

# Inter-Service Communication URLs
ridelink.services.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
ridelink.services.ride-service.url=${RIDE_SERVICE_URL:http://localhost:8083}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Actuator & Logging
management.endpoints.web.exposure.include=health,info
logging.level.com.ridelink=DEBUG
logging.level.org.springframework.data.mongodb=INFO
