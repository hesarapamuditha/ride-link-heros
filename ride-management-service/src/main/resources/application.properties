server.port=8083
spring.application.name=ride-management-service

# Cloud MongoDB Atlas Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/ridelink_ride_db}}
spring.data.mongodb.auto-index-creation=true

# JWT Security
ridelink.jwt.secret=${JWT_SECRET:RideLinkSuperSecretSigningKeyForJwtTokensSecure2026!}
ridelink.jwt.expiration-ms=86400000

# Inter-Service Communication URLs
ridelink.services.driver-service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.services.fare-service.url=${FARE_SERVICE_URL:http://localhost:8084}
ridelink.services.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
logging.level.com.ridelink=DEBUG
