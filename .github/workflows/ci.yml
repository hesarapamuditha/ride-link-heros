name: RideLink Microservices CI Pipeline

# ==============================================================================
# RideLink Continuous Integration Pipeline
# Module: IT3130 - Application Development (Group Assignment)
# Events: Triggered on pushes to main, develop, and feature branches,
#         pull requests targeting integration branches, and manual triggers.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Matrix Build & Test for all 4 Microservices in Parallel
  # ----------------------------------------------------------------------------
  test-microservices:
    name: Test · ${{ matrix.service.name }} (${{ matrix.service.owner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: account-service
            dir: account-service
            port: 8081
            owner: "Member 1 (Account Service)"
          - name: driver-vehicle-service
            dir: driver-vehicle-service
            port: 8082
            owner: "Member 2 (Driver & Vehicle Service)"
          - name: ride-management-service
            dir: ride-management-service
            port: 8083
            owner: "Member 3 (Ride Management Service)"
          - name: fare-payment-service
            dir: fare-payment-service
            port: 8084
            owner: "Member 4 (Fare & Payment Service)"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests for ${{ matrix.service.name }}
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/ridelink_test_db
          JWT_SECRET: RideLinkSuperSecretSigningKeyForJwtTokensSecure2026!
        run: |
          if [ ! -f "${{ matrix.service.dir }}/pom.xml" ]; then
            echo "::notice ::Service pom.xml '${{ matrix.service.dir }}/pom.xml' not present on this branch. Skipping."
            exit 0
          fi
          cd ${{ matrix.service.dir }}
          echo "=========================================================="
          echo "Building and testing ${{ matrix.service.name }}"
          echo "Owner: ${{ matrix.service.owner }}"
          echo "Service Port: ${{ matrix.service.port }}"
          echo "=========================================================="
          mvn clean test -Dnet.bytebuddy.experimental=true --batch-mode

      - name: Upload Surefire Test Reports for ${{ matrix.service.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service.name }}
          path: ${{ matrix.service.dir }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 2: Integrated Monorepo Package Verification
  # ----------------------------------------------------------------------------
  integrated-package:
    name: Package All Microservices & Verify Integration
    needs: test-microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Package Full Solution
        run: |
          if [ ! -f "pom.xml" ]; then
            echo "::notice ::Root pom.xml not present on this branch. Skipping full package."
            exit 0
          fi
          echo "Building complete multi-service reactor solution..."
          mvn clean package -DskipTests=true --batch-mode

      - name: Verify Generated Service Artifacts
        run: |
          if [ ! -f "pom.xml" ]; then
            echo "::notice ::Root pom.xml not present on this branch. Skipping verification."
            exit 0
          fi
          echo "Verifying generated JAR artifacts:"
          ls -lh */target/*.jar || true
