server.port=8081
spring.application.name=account-service

# Cloud MongoDB Atlas Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/ridelink_account_db}}
spring.data.mongodb.auto-index-creation=true

# JWT Security
ridelink.jwt.secret=${JWT_SECRET:RideLinkSuperSecretSigningKeyForJwtTokensSecure2026!}
ridelink.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
logging.level.com.ridelink=DEBUG
